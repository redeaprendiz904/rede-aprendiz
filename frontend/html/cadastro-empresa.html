<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Empresarial | Rede Aprendiz</title>

    <link rel="stylesheet" href="../css/cadastro-empresa.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
</head>

<body>

    <div class="login-container">

        <h2>REDE APRENDIZ</h2>
        <h3>Cadastro de Empresa</h3>

        <form id="formCadastroEmpresa">

            <div class="input-group">
                <label for="nome">Nome da empresa</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    maxlength="100"
                    required>
            </div>

            <div class="input-group">
                <label for="descricao">Descrição</label>
                <textarea
                    id="descricao"
                    name="descricao"
                    maxlength="1000"
                    required></textarea>
            </div>

            <div class="input-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="ti">Tecnologia da Informação</option>
                    <option value="marketing">Marketing</option>
                    <option value="atendimento">Atendimento</option>
                    <option value="mais">Outras áreas</option>
                </select>
            </div>

            <!-- REGIÃO -->
            <div class="input-group">
                <label for="regiao">Região da empresa</label>
                <select id="regiao" name="regiao" required>
                    <option value="">Selecione a região</option>
                    <option value="Norte">Norte</option>
                    <option value="Nordeste">Nordeste</option>
                    <option value="Centro-Oeste">Centro-Oeste</option>
                    <option value="Sudeste">Sudeste</option>
                    <option value="Sul">Sul</option>
                </select>
            </div>

            <!-- ESTADO -->
            <div class="input-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required disabled>
                    <option value="">Selecione primeiro a região</option>
                </select>
            </div>

            <!-- CIDADE -->
            <div class="input-group">
                <label for="cidade">Cidade</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    maxlength="100"
                    placeholder="Ex.: São Luís"
                    required>
            </div>

            <div class="input-group">
                <label for="email">E-mail empresarial</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="100"
                    required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="8"
                    required>
            </div>

            <button type="submit">Cadastrar empresa</button>

            <p id="mensagem" role="status"></p>

            <p class="login-link">
                Já tem uma conta empresarial?
                <a href="login-empresa.html">Entrar</a>
            </p>

            <button
                type="button"
                class="btn-voltar-escolha"
                onclick="window.location.href='cadastro.html'">
                Voltar
            </button>

        </form>

    </div>

    <script>
        const estadosPorRegiao = {
            "Norte": [
                { sigla: "AC", nome: "Acre" },
                { sigla: "AP", nome: "Amapá" },
                { sigla: "AM", nome: "Amazonas" },
                { sigla: "PA", nome: "Pará" },
                { sigla: "RO", nome: "Rondônia" },
                { sigla: "RR", nome: "Roraima" },
                { sigla: "TO", nome: "Tocantins" }
            ],

            "Nordeste": [
                { sigla: "AL", nome: "Alagoas" },
                { sigla: "BA", nome: "Bahia" },
                { sigla: "CE", nome: "Ceará" },
                { sigla: "MA", nome: "Maranhão" },
                { sigla: "PB", nome: "Paraíba" },
                { sigla: "PE", nome: "Pernambuco" },
                { sigla: "PI", nome: "Piauí" },
                { sigla: "RN", nome: "Rio Grande do Norte" },
                { sigla: "SE", nome: "Sergipe" }
            ],

            "Centro-Oeste": [
                { sigla: "DF", nome: "Distrito Federal" },
                { sigla: "GO", nome: "Goiás" },
                { sigla: "MT", nome: "Mato Grosso" },
                { sigla: "MS", nome: "Mato Grosso do Sul" }
            ],

            "Sudeste": [
                { sigla: "ES", nome: "Espírito Santo" },
                { sigla: "MG", nome: "Minas Gerais" },
                { sigla: "RJ", nome: "Rio de Janeiro" },
                { sigla: "SP", nome: "São Paulo" }
            ],

            "Sul": [
                { sigla: "PR", nome: "Paraná" },
                { sigla: "RS", nome: "Rio Grande do Sul" },
                { sigla: "SC", nome: "Santa Catarina" }
            ]
        };

        const campoRegiao = document.getElementById("regiao");
        const campoEstado = document.getElementById("estado");

        campoRegiao.addEventListener("change", function () {
            const regiaoSelecionada = this.value;
            const estados = estadosPorRegiao[regiaoSelecionada] || [];

            campoEstado.innerHTML =
                '<option value="">Selecione o estado</option>';

            estados.forEach(function (estado) {
                const opcao = document.createElement("option");

                opcao.value = estado.sigla;
                opcao.textContent = estado.nome + " (" + estado.sigla + ")";

                campoEstado.appendChild(opcao);
            });

            campoEstado.disabled = estados.length === 0;
        });
    </script>

    <script src="../js/cadastro-empresa.js"></script>

</body>
</html>
